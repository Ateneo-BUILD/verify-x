# An AWS site whose signer reaches S3, SNS and CloudWatch with the EC2
# instance role instead of an IAM user's key. Right only on a host where no
# application runs, since any process on the host can ask the instance's
# metadata service for the role (README.md, "Poll mode").
#
# Install as both
#   /etc/systemd/system/cl03-signer.service.d/instance-role.conf
#   /etc/systemd/system/cl03-signer-reconcile.service.d/instance-role.conf
# then `systemctl daemon-reload`. The empty LoadCredential= clears the AWS
# key files, which are not there; the reconciler gets its report token back.
# With neither key file the signer uses boto3's own chain.
[Service]
LoadCredential=
LoadCredential=report-token:/etc/cl03-signer/credstore/report-token
