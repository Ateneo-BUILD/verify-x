<div id="liveness-overlay" style="display:none; position:fixed; inset:0; z-index:999999;
     justify-content:center; align-items:center; pointer-events:none;">
    <div style="min-width:200px; min-height:200px; display:flex; flex-direction:column;
         justify-content:center; align-items:center; padding:1.5rem 2rem;
         background:rgba(0,0,0,0.75); border-radius:16px;
         text-align:center; font-size:1.1rem; font-weight:500; color:#fff;">
        <div style="width:150px; height:150px; margin-bottom:1rem; border:6px solid rgba(255,255,255,0.2);
             border-top-color:#3b82f6; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
        <span id="liveness-overlay-text">Liveness check in progress...</span>
        <span id="liveness-overlay-sub" style="display:none; margin-top:0.4rem; font-size:0.85rem;
              font-weight:400; opacity:0.75; line-height:1.35; max-width:16rem;"></span>
        <span id="liveness-overlay-late" style="display:none; margin-top:0.6rem; font-size:0.8rem;
              font-weight:400; color:#ffd08a; line-height:1.35; max-width:16rem;">Still working &mdash; the
              PSA service is slow right now.</span>
    </div>
</div>
