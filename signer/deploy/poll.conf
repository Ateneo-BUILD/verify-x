# A signer on a host of its own, which dials out to the site and long-polls
# it for jobs: `transport = "poll"` in policy.toml (README.md, "Poll mode").
# `install.sh --poll` puts it in place as
#   /etc/systemd/system/cl03-signer.service.d/poll.conf
# then `systemctl daemon-reload`.
#
# The key shared with the site (its SIGNER_QUEUE_KEY), as a credential only
# the signer reads. The file's name sorts after instance-role.conf and
# local-ledger.conf, whose empty LoadCredential= clears the list first.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
LoadCredential=poll-key:/etc/cl03-signer/credstore/poll-key
