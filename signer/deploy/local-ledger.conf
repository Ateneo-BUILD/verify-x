# A development site with no AWS: policy.toml sets `ledger_dir` under
# /var/lib/cl03-signer, so the ledger stays on the host, alerts go to the
# journal, and nothing is sent anywhere (README.md, "A development site").
#
# Install as both
#   /etc/systemd/system/cl03-signer.service.d/local-ledger.conf
#   /etc/systemd/system/cl03-signer-reconcile.service.d/local-ledger.conf
# then `systemctl daemon-reload`. The empty LoadCredential= clears the AWS
# credentials, which are not there; the reconciler gets its report token back.
[Service]
LoadCredential=
LoadCredential=report-token:/etc/cl03-signer/credstore/report-token
