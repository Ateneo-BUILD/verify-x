# Drop-in for gunicorn.service: /etc/systemd/system/gunicorn.service.d/verify-app.conf
# gunicorn as a user WITHOUT sudo. On Amazon Linux 2023 ec2-user has
# passwordless sudo, so an app bug running as ec2-user is root and can read
# the signer's key; the signer's separation means nothing without this.
[Service]
User=verify-app
Group=verify-app
SupplementaryGroups=
